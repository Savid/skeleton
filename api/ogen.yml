# ogen generates the server side only: routing, request decoding, response
# encoding and validation. The web client is generated by hey-api instead.
# There is no Unimplemented stub, so a new operation fails to compile until
# internal/server implements it.
generator:
  features:
    disable_all: true
    enable:
      - paths/server
  # ogen cannot generate SSE servers, nor the untagged oneOf of event types
  # an SSE response declares. Those operations are hand-routed in
  # internal/server, and a contract test there checks every one is served.
  ignore_not_implemented:
    - sse server response encoding
    - type-based discrimination with same jxType
