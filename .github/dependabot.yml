# Weekly, grouped bumps for what is pinned by digest or commit: the
# Dockerfile's base images and CI's actions. Go and npm packages are updated
# by hand, all at once, behind pnpm's release-age and trust policies and make
# check. A release must be three days old (cooldown) before it is proposed.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      images:
        patterns: ['*']
    ignore:
      # Go and pnpm versions are pinned in several files (AGENTS.md) and move
      # together, by hand. Dependabot still refreshes their digests when the
      # image is rebuilt for the same version.
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '*pnpm/pnpm'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
