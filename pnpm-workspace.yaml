packages:
  - web

saveExact: true

# Refuse a version published with weaker provenance than an earlier one.
trustPolicy: no-downgrade

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

# Dependencies' approved agent skills are linked beside the repo's own;
# .claude/skills links to this directory.
skills:
  dirs:
    - .agents/skills

overrides:
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0 exactly, which has
  # quadratic-CPU advisories fixed in 4.3.2. Drop once it moves past that.
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
  # Storybook pins this docgen plugin to ^0.7.0, which takes glob 13 and so
  # minimatch 10, both with advisories (GHSA-3g3m-2fjr-6pw4,
  # GHSA-g3hv-75wg-m249). Its one globSync call works the same on glob 14.
  # Plugin 0.8+ drops glob but lost npm provenance, which trustPolicy refuses.
  # Drop once @storybook/react-vite takes a plugin past glob 13.
  '@joshwooding/vite-plugin-react-docgen-typescript>glob': 14.0.6

peerDependencyRules:
  allowedVersions:
    # typescript-eslint's experimental tsgo backend wants TypeScript 7.1 as
    # @typescript/native; lint does not enable it, and 7.1 is not yet stable.
    # Drop once @typescript/native is 7.1 or later.
    '@typescript-eslint/typescript-estree>@typescript/native': '7.0'

permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
