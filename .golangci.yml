version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dupword
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - tagliatelle
    - tparallel
    - unconvert
    - usetesting
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    cyclop:
      max-complexity: 30

    # pkg/ holds decision packages: pure functions of their inputs, reusable
    # outside this daemon. They take data, time and randomness from the host
    # and never reach transport, storage or the rest of the application. The
    # import-graph version of the same boundary is
    # internal/testutil/importguard/boundary_test.go.
    depguard:
      rules:
        decision-packages:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/savid/skeleton/internal
              desc: pkg/ must not import application code
            - pkg: github.com/savid/skeleton/api
              desc: pkg/ must not import generated API types
            - pkg: net/http
              desc: pkg/ must not bind to HTTP transport
            - pkg: database/sql
              desc: pkg/ takes typed values, not database handles

    # Decision packages read no clock and roll no dice: the host passes time in
    # and gets timestamps back, so every decision replays exactly.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: pass time into decisions; never read the process clock
        - pattern: ^time\.(Since|Until)$
          msg: derive durations from input timestamps, not the process clock
        - pattern: ^time\.(After|AfterFunc|Sleep|NewTimer|NewTicker|Tick)$
          msg: decisions never sleep or schedule; return deadlines to the host
        - pattern: ^rand\..*$
          msg: decisions are deterministic; take randomness as an input

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 20

    errcheck:
      check-type-assertions: true

    tagliatelle:
      case:
        rules:
          yaml: kebab
          json: camel

    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true

    nolintlint:
      require-explanation: true
      require-specific: true

    # Loggers are injected, never global; use the Context variants when a
    # context is in scope.
    sloglint:
      no-global: all
      context: scope

    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      # Host code owns clocks, timers and randomness; only pkg/ is restricted,
      # and its tests may build their own time.
      - path-except: ^pkg/
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/savid/skeleton
